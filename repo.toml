# mixu-spoiler: workspace identity descriptor (mirrors workspace.toml).
[repo]
name = "mixu-spoiler"
kind = "core"
lang = "kotlin"
role = "knowledge-horizon filter (anti-spoiler firewall)"
visibility = "public"
owner = "mixu-core"
docs = "mixu-docs"

[contracts.provides]
horizon-policy = "src/main/kotlin/.../policy"        # fail-closed filtering rules
filter-api = "src/main/kotlin/.../SpoilerFilter"   # projection + retrieval guard

[contracts.consumes]
graph-model = "mixu-graph: model"
graph-pack-schema = "mixu-contracts: schemas/graph/*.schema.json"
spoiler-corpus = "mixu-fixtures: fixtures/synthetic"
